[project]
name = "squeeze"
version = "0.1.0"
description = "Compress token-heavy files into compact, LLM-ready text, with Meta's Muse Spark deciding what each image is worth."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "tiktoken",
    "python-pptx",
    "pypdfium2",
    "trafilatura",
    "pillow",
    "imagehash",
    "httpx",
    "diskcache",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
squeeze = "squeeze.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["squeeze"]

[tool.setuptools.package-data]
squeeze = ["static/*"]
