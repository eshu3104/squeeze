name: Live Muse Spark check

# Manual only: runs one real Muse Spark call, then the eval with the fact check.
# Needs the repository secret META_API_KEY. Secrets are never available to forks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash  # bash -eo pipefail: a failed script fails the step even when piped into tee
    env:
      SQUEEZE_BACKEND: meta-api
      META_API_KEY: ${{ secrets.META_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: One real call
        run: python scripts/check_api.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Eval with fact check
        run: python scripts/eval.py --fidelity | tee -a "$GITHUB_STEP_SUMMARY"
